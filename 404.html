<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MeTenk</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you are looking for does not exist or has been moved. Go back to MeTenk home to continue focusing." data-i18n-attr="content:metaDescription">
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 560px;
        }
        .code {
            font-size: 96px;
            font-weight: 800;
            background: linear-gradient(135deg, #4361ee 0%, #4ade80 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 12px;
        }
        p {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .redirect-note {
            color: #6b7280;
            font-size: 14px;
            min-height: 20px;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s ease, background 0.2s ease;
        }
        .btn-primary {
            background: #4361ee;
            color: #ffffff;
        }
        .btn-primary:hover {
            opacity: 0.85;
        }
        .btn-ghost {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e5e7eb;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
        }
    </style>
    <link rel="stylesheet" href="assets/i18n.css">
</head>
<body>
    <main class="container">
        <div class="code">404</div>
        <h1 data-i18n="pageTitle">Page Not Found</h1>
        <p data-i18n="notFoundBody">The page you are looking for doesn't exist or has been moved.</p>
        <p class="redirect-note" id="redirect-note">Redirecting to the requested page ...</p>
        <div class="links">
            <a href="/" class="btn btn-primary" data-i18n="backHome">Back to Home</a>
            <a href="/vip-redeem-code.html" class="btn btn-ghost" data-i18n="vipRedeem">VIP Redeem Code</a>
        </div>
    </main>

    <footer class="i18n-footer">
        <span data-i18n-slot></span>
    </footer>

    <script>
        // Clean-URL redirect: /vip-redeem-code -> /vip-redeem-code.html
        (function () {
            var pages = [
                'vip-redeem-code', 'about', 'sponsor', 'privacy-policy',
                'clockmax', 'clock-privacy-policy', 'pickcolor-privacy-policy'
            ];
            var note = document.getElementById('redirect-note');
            var segment = location.pathname.split('/').filter(Boolean).pop() || '';

            if (!segment || segment.indexOf('.') !== -1 || pages.indexOf(segment) === -1) {
                // Not a clean-URL redirect target: clear the placeholder note.
                if (note) note.textContent = '';
                return;
            }

            var FALLBACK = 'Redirecting to /{page}.html ...';

            function renderNote() {
                if (!note) return;
                var tpl = (window.MetiI18n && window.MetiI18n.t)
                    ? window.MetiI18n.t('redirectNote', FALLBACK)
                    : FALLBACK;
                note.textContent = String(tpl).replace('{page}', segment);
            }

            function redirect() {
                renderNote();
                location.replace('/' + segment + '.html');
            }

            // The i18n runtime boots on DOMContentLoaded; defer one tick so the
            // note is already localized before the browser navigates away.
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () {
                    setTimeout(redirect, 0);
                });
            } else {
                setTimeout(redirect, 0);
            }
        })();
    </script>

    <script defer src="assets/locales/404.js"></script>
    <script defer src="assets/i18n.js"></script>
</body>
</html>
